name: Windows checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:privacy
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
