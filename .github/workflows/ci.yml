name: Windows and Linux checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:privacy
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - run: node tests/server-http.cjs
      - run: npm audit --omit=dev --audit-level=high
